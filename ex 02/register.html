<!DOCTYPE html>
<html>

<head>
    <title>Register - Online Dress Shopping System</title>
</head>

<body background="back.jpg">

<center>

<font color="deeppink">
<h1>ONLINE DRESS SHOPPING SYSTEM</h1>
</font>

<hr width="50%">

<h2>Create New Account</h2>

<form action="home.html">

<table cellpadding="10">

<tr>
<td><b>Full Name</b></td>
<td><input type="text" placeholder="Enter Full Name" required></td>
</tr>

<tr>
<td><b>Gender</b></td>
<td>
<input type="radio" name="gender">Male
<input type="radio" name="gender">Female
</td>
</tr>

<tr>
<td><b>Date of Birth</b></td>
<td><input type="date" required></td>
</tr>

<tr>
<td><b>Email</b></td>
<td><input type="email" placeholder="Enter Email" required></td>
</tr>

<tr>
<td><b>Mobile Number</b></td>
<td><input type="tel" placeholder="Enter Mobile Number" required></td>
</tr>

<tr>
<td><b>Address</b></td>
<td>
<textarea rows="4" cols="22" placeholder="Enter Address"></textarea>
</td>
</tr>


<tr>
<td><b>Create Password</b></td>
<td><input type="password" placeholder="Create Password" required></td>
</tr>

<tr>
<td><b>Confirm Password</b></td>
<td><input type="password" placeholder="Confirm Password" required></td>
</tr>

<tr>
<td colspan="2" align="center">
<a href="home.html">
<input type="submit" value="Register">
</a>
<input type="reset" value="Clear">
</td>
</tr>

</table>

</form>

<hr width="50%">

<p>
Already have an account?
<a href="login.html">Login Here</a>
</p>

</center>

</body>

</html>
