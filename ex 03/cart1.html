<!DOCTYPE html>
<html>

<head>
    <title>Shopping Cart</title>
</head>

<body background="back1.jpg" style="background-size:cover; background-repeat:no-repeat; font-family:Arial;">


<center>

<h1 style="color:purple;">SHOPPING CART</h1>

<hr style="width:70%;">

<table border="1" cellpadding="10" width="70%"
style="border-collapse:collapse; background-color:#FFF8DC; border:3px solid purple;">

<tr style="background-color:deeppink; color:white;">
<th>Dress</th>
<th>Price</th>
<th>Quantity</th>
<th>Total</th>
<th>Action</th>
</tr>

<tr>

<td align="center" style="border:1px solid gray;">
<img src="casual1.webp" width="100" height="130"
style="border:3px solid purple; border-radius:8px;"><br>
<b>Casual Dress</b>
</td>

<td align="center" style="border:1px solid gray;">
₹799
</td>

<td align="center" style="border:1px solid gray;">
<input type="number" min="1" max="10" value="1"
style="width:60px; padding:5px; border:2px solid purple; border-radius:5px;">
</td>

<td align="center" style="border:1px solid gray;">
₹799
</td>

<td align="center" style="border:1px solid gray;">
<input type="button" value="Remove"
style="background-color:red; color:white; border:none; padding:8px 15px; border-radius:5px; cursor:pointer;">
</td>

</tr>

</table>

<br><br>

<h2 style="color:purple;">Order Form</h2>

<form>

<table cellpadding="8"
style="background-color:#FFF8DC; border:3px solid purple; border-collapse:collapse;">

<tr>
<td><b>Name</b></td>
<td>
<input type="text" required
style="width:220px; padding:6px; border:2px solid purple; border-radius:5px;">
</td>
</tr>

<tr>
<td><b>Email</b></td>
<td>
<input type="email" required
style="width:220px; padding:6px; border:2px solid purple; border-radius:5px;">
</td>
</tr>

<tr>
<td><b>Mobile Number</b></td>
<td>
<input type="tel" required
style="width:220px; padding:6px; border:2px solid purple; border-radius:5px;">
</td>
</tr>

<tr>
<td><b>Delivery Address</b></td>
<td>
<textarea rows="4" cols="25"
style="border:2px solid purple; border-radius:5px;"></textarea>
</td>
</tr>

<tr>
<td><b>Payment Method</b></td>
<td>
<input type="radio" name="pay"> Cash on Delivery <br><br>
<input type="radio" name="pay"> UPI <br><br>
<input type="radio" name="pay"> Credit / Debit Card
</td>
</tr>

<tr>
<td><b>Delivery Date</b></td>
<td>
<input type="date"
style="padding:5px; border:2px solid purple; border-radius:5px;">
</td>
</tr>

<tr>
<td colspan="2" align="center">

<button type="button"
onclick="alert('Order Placed Successfully!')"
style="background-color:deeppink; color:white; padding:10px 18px; border:none; border-radius:5px; cursor:pointer;">
Place Order
</button>

<input type="reset" value="Clear"
style="background-color:purple; color:white; padding:10px 18px; border:none; border-radius:5px; cursor:pointer;">

</td>
</tr>

</table>

</form>

<br>

<a href="home1.html"
style="text-decoration:none; color:blue; font-size:18px; font-weight:bold;">
← Continue Shopping
</a>

</center>

</body>

</html>
