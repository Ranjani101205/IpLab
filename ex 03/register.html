<!DOCTYPE html>
<html>

<head>
    <title>Register - Online Dress Shopping System</title>
</head>

<body background="back1.jpg" style="background-size:cover; background-repeat:no-repeat; font-family:Arial;">

<center>

<br>

<h1 style="color:deeppink; font-size:40px; text-shadow:3px 3px 5px white; letter-spacing:2px;">
ONLINE DRESS SHOPPING SYSTEM
</h1>

<hr width="50%" style="height:4px; background-color:deeppink; border:none;">

<h2 style="color:white; background-color:rgba(255,20,147,0.7); width:300px; padding:10px; border-radius:10px;">
Create New Account
</h2>

<form action="home.html">

<table cellpadding="12"
style="background-color:rgba(255,255,255,0.85); border:3px solid deeppink; border-radius:20px; padding:20px; box-shadow:8px 8px 15px gray;">

<tr>
<td style="font-size:18px; color:purple;"><b>Full Name</b></td>
<td>
<input type="text" placeholder="Enter Full Name" required
style="width:230px; height:35px; border:2px solid deeppink; border-radius:8px; padding-left:10px;">
</td>
</tr>

<tr>
<td style="font-size:18px; color:purple;"><b>Gender</b></td>
<td style="font-size:17px;">
<input type="radio" name="gender"> Male
&nbsp;&nbsp;
<input type="radio" name="gender"> Female
</td>
</tr>

<tr>
<td style="font-size:18px; color:purple;"><b>Date of Birth</b></td>
<td>
<input type="date" required
style="width:230px; height:35px; border:2px solid deeppink; border-radius:8px;">
</td>
</tr>

<tr>
<td style="font-size:18px; color:purple;"><b>Email</b></td>
<td>
<input type="email" placeholder="Enter Email" required
style="width:230px; height:35px; border:2px solid deeppink; border-radius:8px; padding-left:10px;">
</td>
</tr>

<tr>
<td style="font-size:18px; color:purple;"><b>Mobile Number</b></td>
<td>
<input type="tel" placeholder="Enter Mobile Number" required
style="width:230px; height:35px; border:2px solid deeppink; border-radius:8px; padding-left:10px;">
</td>
</tr>

<tr>
<td style="font-size:18px; color:purple;"><b>Address</b></td>
<td>
<textarea rows="4" cols="25" placeholder="Enter Address"
style="border:2px solid deeppink; border-radius:8px; padding:8px; resize:none;"></textarea>
</td>
</tr>

<tr>
<td style="font-size:18px; color:purple;"><b>Create Password</b></td>
<td>
<input type="password" placeholder="Create Password" required
style="width:230px; height:35px; border:2px solid deeppink; border-radius:8px; padding-left:10px;">
</td>
</tr>

<tr>
<td style="font-size:18px; color:purple;"><b>Confirm Password</b></td>
<td>
<input type="password" placeholder="Confirm Password" required
style="width:230px; height:35px; border:2px solid deeppink; border-radius:8px; padding-left:10px;">
</td>
</tr>

<tr>
<td colspan="2" align="center">

<input type="submit" value="Register"
style="background-color:deeppink; color:white; border:none; padding:10px 25px; border-radius:8px; font-size:16px; cursor:pointer;">

&nbsp;&nbsp;

<input type="reset" value="Clear"
style="background-color:gray; color:white; border:none; padding:10px 25px; border-radius:8px; font-size:16px; cursor:pointer;">

</td>
</tr>

</table>

</form>

<br>

<hr width="50%" style="height:4px; background-color:deeppink; border:none;">

<p style="font-size:18px; color:white;">
Already have an account?
<a href="login1.html"
style="color:yellow; text-decoration:none; font-weight:bold; font-size:20px;">
Login Here
</a>
</p>

</center>

</body>

</html>
